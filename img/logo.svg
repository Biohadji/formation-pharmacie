<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="250" cy="250" r="240"/>
    </clipPath>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="250" cy="250" r="250" fill="#1a5276"/>
  
  <!-- White border ring -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="white" stroke-width="8"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Inner blue circle -->
  <circle cx="250" cy="250" r="210" fill="#1a5276"/>
  
  <!-- Text path for top text -->
  <path id="top-arc" d="M 80,250 A 170,170 0 0,1 420,250" fill="none"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="white" letter-spacing="8">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">PHARMACIE</textPath>
  </text>
  
  <!-- Text path for bottom text -->
  <path id="bottom-arc" d="M 80,250 A 170,170 0 0,0 420,250" fill="none"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="white" letter-spacing="4">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">ABDELAZIZ BRAHIM</textPath>
  </text>
  
  <!-- Bowl of Hygieia (Pharmacy symbol) -->
  <g transform="translate(250, 240)" fill="white">
    <!-- Chalice base -->
    <ellipse cx="0" cy="85" rx="35" ry="8"/>
    
    <!-- Chalice stem -->
    <rect x="-4" y="30" width="8" height="55" rx="4"/>
    
    <!-- Chalice bowl -->
    <path d="M -45,30 Q -45,-30 0,-40 Q 45,-30 45,30 Z" fill="none" stroke="white" stroke-width="5"/>
    
    <!-- Snake body -->
    <path d="M -30,-20 
             C -30,-50 20,-60 25,-40
             C 30,-20 -10,-10 -15,10
             C -20,30 15,40 20,20
             C 25,0 -5,10 -10,30
             C -15,50 10,55 15,40"
          fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Snake head -->
    <circle cx="15" cy="38" r="6" fill="white"/>
    <circle cx="18" cy="36" r="2" fill="#1a5276"/>
  </g>
  
  <!-- Small decorative circles -->
  <circle cx="100" cy="250" r="5" fill="white"/>
  <circle cx="400" cy="250" r="5" fill="white"/>
</svg>