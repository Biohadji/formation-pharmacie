                            <button onclick="showPage('admin-codes')" class="admin-action-btn">
                                <i class="fas fa-key"></i>
                                <span data-i18n="admin_manage_codes"></span>
                            </button>
                            <button onclick="showPage('admin-certificates')" class="admin-action-btn">
                                <i class="fas fa-award"></i>
                                <span data-i18n="admin_manage_certificates"></span>
                            </button>
                            <button onclick="showPage('admin-scores')" class="admin-action-btn">
                                <i class="fas fa-chart-bar"></i>
                                <span data-i18n="admin_view_scores"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Admin Members Page -->
            <div id="page-admin-members" class="page">
                <div class="section-header admin-header">
                    <h1><i class="fas fa-users"></i> <span data-i18n="admin_members_title"></span></h1>
                </div>
                <div class="admin-table-container">
                    <div class="admin-search">
                        <input type="text" id="member-search" placeholder="بحث عن عضو..." oninput="searchMembers()">
                    </div>
                    <table class="admin-table" id="members-table">
                        <thead>
                            <tr>
                                <th data-i18n="th_name"></th>
                                <th data-i18n="th_email"></th>
                                <th data-i18n="th_phone"></th>
                                <th data-i18n="th_status"></th>
                                <th data-i18n="th_actions"></th>
                            </tr>
                        </thead>
                        <tbody id="members-tbody">
                            <!-- Members will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Admin Codes Page -->
            <div id="page-admin-codes" class="page">
                <div class="section-header admin-header">
                    <h1><i class="fas fa-key"></i> <span data-i18n="admin_codes_title"></span></h1>
                </div>
                <div class="admin-container">
                    <div class="generate-code-section">
                        <h3 data-i18n="admin_generate_code"></h3>
                        <div class="generate-form">
                            <select id="code-member-select">
                                <option value="" data-i18n="select_member"></option>
                            </select>
                            <select id="code-course-select">
                                <option value="all" data-i18n="all_courses"></option>
                                <option value="seller" data-i18n="course_seller"></option>
                                <option value="preparator" data-i18n="course_preparator"></option>
                            </select>
                            <button onclick="generateActivationCode()" class="generate-btn">
                                <i class="fas fa-plus"></i> <span data-i18n="generate_code_btn"></span>
                            </button>
                        </div>
                    </div>
                    <div class="codes-list-section">
                        <h3 data-i18n="existing_codes"></h3>
                        <table class="admin-table" id="codes-table">
                            <thead>
                                <tr>
                                    <th data-i18n="th_member"></th>
                                    <th data-i18n="th_code"></th>
                                    <th data-i18n="th_course"></th>
                                    <th data-i18n="th_used"></th>
                                    <th data-i18n="th_actions"></th>
                                </tr>
                            </thead>
                            <tbody id="codes-tbody">
                                <!-- Codes will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Admin Certificates Page -->
            <div id="page-admin-certificates" class="page">
                <div class="section-header admin-header">
                    <h1><i class="fas fa-award"></i> <span data-i18n="admin_certificates_title"></span></h1>
                </div>
                <div class="admin-container">
                    <div class="issue-certificate-section">
                        <h3 data-i18n="admin_issue_cert"></h3>
                        <div class="generate-form">
                            <select id="cert-member-select">
                                <option value="" data-i18n="select_member"></option>
                            </select>
                            <select id="cert-course-select">
                                <option value="seller" data-i18n="course_seller"></option>
                                <option value="preparator" data-i18n="course_preparator"></option>
                            </select>
                            <button onclick="issueCertificate()" class="generate-btn cert-btn">
                                <i class="fas fa-award"></i> <span data-i18n="issue_cert_btn"></span>
                            </button>
                        </div>
                    </div>
                    <div class="certificates-list-section">
                        <h3 data-i18n="issued_certificates"></h3>
                        <table class="admin-table" id="certificates-table">
                            <thead>
                                <tr>
                                    <th data-i18n="th_member"></th>
                                    <th data-i18n="th_course"></th>
                                    <th data-i18n="th_score"></th>
                                    <th data-i18n="th_date"></th>
                                    <th data-i18n="th_actions"></th>
                                </tr>
                            </thead>
                            <tbody id="certificates-tbody">
                                <!-- Certificates will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Admin Scores Page -->
            <div id="page-admin-scores" class="page">
                <div class="section-header admin-header">
                    <h1><i class="fas fa-chart-bar"></i> <span data-i18n="admin_scores_title"></span></h1>
                </div>
                <div class="admin-table-container">
                    <table class="admin-table" id="scores-table">
                        <thead>
                            <tr>
                                <th data-i18n="th_member"></th>
                                <th data-i18n="th_seller_score"></th>
                                <th data-i18n="th_prep_score"></th>
                                <th data-i18n="th_best_score"></th>
                                <th data-i18n="th_status"></th>
                            </tr>
                        </thead>
                        <tbody id="scores-tbody">
                            <!-- Scores will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Floating Install Button for Mobile -->
            <div id="mobile-install-banner" class="mobile-install-banner" style="display:none;">
                <div class="install-banner-content">
                    <i class="fas fa-mobile-alt"></i>
                    <div class="install-banner-text">
                        <strong data-i18n="install_title"></strong>
                        <p data-i18n="install_subtitle"></p>
                    </div>
                    <button class="install-banner-btn" onclick="installApp()">
                        <i class="fas fa-download"></i> <span data-i18n="install_now"></span>
                    </button>
                    <button class="install-banner-close" onclick="closeInstallBanner()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Footer -->
            <footer class="footer">
                <div class="footer-content">
                    <div class="footer-brand">
                        <i class="fas fa-prescription-bottle-medical"></i>
                        <span data-i18n="academy_name"></span>
                    </div>
                    <p class="footer-copy" data-i18n="footer_copy"></p>
                </div>
            </footer>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/data.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
